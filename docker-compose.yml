# Optional local PostgreSQL if you are not using Neon.
# The default application.yml already points at the Neon database.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: erp_school
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
    ports:
      - "5432:5432"
    volumes:
      - erp_pg_data:/var/lib/postgresql/data

volumes:
  erp_pg_data:
